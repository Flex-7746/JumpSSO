name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: "22.22.0"

      # 读取 package.json 里的 version 和 changelog 作为 app/manifest 里的配置
      - name: Get version
        id: read_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Update version in manifest file
        run: |
          sed -i "s|version=0.0.1|version=${{ steps.read_version.outputs.version }}|" app/manifest
      - name: Get changelog
        id: read_log
        run: |
          CHANGELOG=$(jq -r '.changelog' package.json)
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
      - name: Update changelog in manifest file
        run: |
          sed -i "s|changelog=changelog|changelog=${{ steps.read_log.outputs.changelog }}|" app/manifest

      # 读取 CHANGELOG.md 里的更新记录
      - name: Get changelog body
        id: read_changelog
        run: |
          awk -v ver="${{ steps.read_version.outputs.version }}" '
            /^## / {
              if (found) exit
              if ($0 ~ "^## " ver "( |$)" ) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md >> RELEASE.md

      # 安装前端依赖
      - name: Install
        run: npm i --prefix=frontend

      # 打包前端代码
      - name: Build frontend
        run: npm run build --prefix=frontend

      # 打包后端代码
      - name: Build backend
        run: |
          rm -rf ./app/app/server
          cp -R ./backend ./app/app/server
          cd backend
          tar -czvf ../jumpsso.${{ steps.read_version.outputs.version}}.tar.gz .

      # 打包飞牛 x86 文件
      - name: Build x86 fnpack package
        run: |
          chmod +x ./build/fnpack-1.2.1-linux-amd64
          ./build/fnpack-1.2.1-linux-amd64 build app
      - name: Rename x86 package
        run: mv jumpsso.fpk jumpsso.${{ steps.read_version.outputs.version}}.x86.fpk

      # 打包 arm 文件
      - name: Update arm platform in manifest file
        run: |
          sed -i "s|platform=x86|platform=arm|" app/manifest
      - name: Build arm package
        run: |
          chmod +x ./build/fnpack-1.2.1-linux-amd64
          ./build/fnpack-1.2.1-linux-amd64 build app
      - name: Rename arm package
        run: mv jumpsso.fpk jumpsso.${{ steps.read_version.outputs.version}}.arm.fpk

      - name: Show File
        run: |
          ls -aa

      # 发布文件
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.read_version.outputs.version}}
          name: v${{ steps.read_version.outputs.version}}
          bodyFile: RELEASE.md
          artifacts: "jumpsso.${{ steps.read_version.outputs.version}}.tar.gz,jumpsso.${{ steps.read_version.outputs.version}}.x86.fpk,jumpsso.${{ steps.read_version.outputs.version}}.arm.fpk"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Docker
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jumpsso:v${{ steps.read_version.outputs.version }}
          platforms: linux/amd64,linux/arm64
